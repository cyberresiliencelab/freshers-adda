name: Deploy Freshers Adda to GitHub Pages
 
# Publishes the site every time you push to main. No build step — it's a static site.
on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Configure Pages
        uses: actions/configure-pages@v5
 
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # the whole repo root is the site (index.html at top level)
 
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
 
